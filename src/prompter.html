<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <title>HushPane Prompt</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="prompter.css" />
  </head>
  <body>
    <div class="prompter-shell" id="shell">
      <div class="drag-strip">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <button class="hide-prompt" id="hide" type="button" aria-label="Hide prompt">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4 L12 12 M12 4 L4 12" />
          </svg>
        </button>
      </div>
      <div class="eye-line" aria-hidden="true"></div>
      <div class="viewport" id="viewport">
        <article id="content"></article>
      </div>
      <div class="paused-badge" id="paused">PAUSED</div>
      <div class="manual-hint">SCROLL OR USE ↑ / ↓</div>
    </div>
    <script src="prompter.js"></script>
  </body>
</html>
